name: Build Release Assets
run-name: Build Release Assets
on:
  workflow_dispatch:


jobs:
  build-release:
    name: Build Release Asset Buildbox
    # Build assets on x86 for now, as no GHA-hosted runner for ARM64.
    runs-on: ubuntu-22.04-32core
    env:
      GOCACHE: /tmp/gocache

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Teleport
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - name: Build and push buildbox assets image
        run: |
         sudo mkdir -p ${GOCACHE}
         sudo chmod 777 ${GOCACHE}

         make -C build.assets release

      - name: Extract version from Makefile
        id: version
        run: |
          VERSION=$(grep '^VERSION=' Makefile | cut -d= -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: |
            teleport-v${{ steps.version.outputs.version }}-linux-amd64-bin.tar.gz
            teleport-update-v${{ steps.version.outputs.version }}-linux-amd64-bin.tar.gz
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Teleport
        uses: actions/checkout@v4

      - name: Extract version from Makefile
        id: version
        run: |
          VERSION=$(grep '^VERSION=' Makefile | cut -d= -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-tarballs

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Teleport ${{ steps.version.outputs.version }}" \
            --notes "Release ${{ steps.version.outputs.version }}" \
            teleport-v${{ steps.version.outputs.version }}-linux-amd64-bin.tar.gz \
            teleport-update-v${{ steps.version.outputs.version }}-linux-amd64-bin.tar.gz
